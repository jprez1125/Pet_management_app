{% extends "pets/base.html" %}

{% block content %}
<h2>Login</h2>

{% if form.errors %}
    <p style="color: red;">Your username and password did not match. Please try again.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn-primary">Login</button>
</form>
{% endblock %}
